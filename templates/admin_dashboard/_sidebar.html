<aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-header">
        <img src="{{ school_logo_url }}" alt="Logo" class="sidebar-logo"
             data-brand-logo data-fallback-src="{{ default_logo_url }}">
        <span class="sidebar-title">Admin Panel</span>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'admin_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
            <span class="sidebar-icon">📊</span> Dashboard
        </a>
        <a href="{% url 'buses:bus_list' %}" class="sidebar-link {% if 'buses' in request.resolver_match.namespace %}active{% endif %}">
            <span class="sidebar-icon">🚌</span> Buses
        </a>
        <a href="{% url 'routes:route_list' %}" class="sidebar-link {% if 'routes' in request.resolver_match.namespace %}active{% endif %}">
            <span class="sidebar-icon">🗺️</span> Routes
        </a>
        <a href="{% url 'trip_history' %}" class="sidebar-link {% if request.resolver_match.url_name == 'trip_history' or request.resolver_match.url_name == 'trip_replay' %}active{% endif %}">
            <span class="sidebar-icon">🕘</span> Trip History
        </a>
        <a href="{% url 'accounts:user_list' %}" class="sidebar-link {% if request.resolver_match.url_name == 'user_list' %}active{% endif %}">
            <span class="sidebar-icon">👥</span> Users
        </a>
        <a href="{% url 'school_settings:settings' %}" class="sidebar-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
            <span class="sidebar-icon">⚙️</span> School Settings
        </a>
        <a href="{% url 'accounts:admin_change_password' %}" class="sidebar-link {% if request.resolver_match.url_name == 'admin_change_password' %}active{% endif %}">
            <span class="sidebar-icon">🔑</span> Change Password
        </a>
        <hr class="sidebar-divider">
        <a href="/" class="sidebar-link">
            <span class="sidebar-icon">🏠</span> View Website
        </a>
        <a href="{% url 'accounts:logout' %}" class="sidebar-link logout-link">
            <span class="sidebar-icon">🚪</span> Logout
        </a>
    </nav>
</aside>
