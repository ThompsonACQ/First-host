services:
  - type: web
    name: campus-shuttle
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && SKIP_CLOUDINARY_CONFIG_CHECK=1 python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-shuttle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campus-shuttle-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: keyvalue
    name: campus-shuttle-redis
    plan: free
    region: oregon
    ipAllowList: []
databases:
  - name: campus-shuttle-db
    databaseName: campus_shuttle
    user: shuttle_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
